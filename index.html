    <link rel="mask-icon" href="/icon-maskable.svg" color="#B88736" />

    <script>
      // Clear legacy Service Workers and stale Cache Storage immediately before module execution.
      // React owns the visible startup/loading state; keep this bootstrap invisible so an old
      // static placeholder can never mask a successful application mount.
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) { caches.delete(key); });
          });
        }
      } catch (e) {
        console.warn('Storage purge bypassed', e);
      }

      window.addEventListener('error', function(event) {
        console.error('App load issue detected:', event.error || event.message);
      });
    </script>
  </head>
  <body class="bg-[#F8F4EC] text-[#2A2420] antialiased selection:bg-[#EAD5A8] selection:text-[#2A2420]">
