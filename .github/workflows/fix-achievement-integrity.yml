name: Fix Achievement Integrity

on:
  push:
    paths:
      - '.github/workflows/fix-achievement-integrity.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch achievement sources of truth
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected 1 match, found {count}')
            return text.replace(old, new, 1)

          path = Path('src/components/ArchangelMichaelPrayerModal.tsx')
          text = path.read_text()
          text = replace_once(text, '  voicePitch?: number;\n}', '  voicePitch?: number;\n  onProgressChange?: (days: number[]) => void;\n}', 'archangel prop')
          text = replace_once(text, '  voiceRate = 0.84,\n  voicePitch = 1.0\n}: ArchangelMichaelPrayerModalProps)', '  voiceRate = 0.84,\n  voicePitch = 1.0,\n  onProgressChange\n}: ArchangelMichaelPrayerModalProps)', 'archangel destructure')
          text = replace_once(text, '    setCompletedDays(updated);\n    setCompletedToday(true);', '    setCompletedDays(updated);\n    setCompletedToday(true);\n    onProgressChange?.(updated);', 'archangel save callback')
          path.write_text(text)

          path = Path('src/components/HooponoponoModal.tsx')
          text = path.read_text()
          text = replace_once(text, '  userProfile?: UserProfile;\n}', '  userProfile?: UserProfile;\n  onPracticeCountChange?: (count: number) => void;\n}', 'hoop prop')
          text = replace_once(text, "export default function HooponoponoModal({ isOpen, onClose, userName = 'Buscador de Luz', userProfile }: HooponoponoModalProps)", "export default function HooponoponoModal({ isOpen, onClose, userName = 'Buscador de Luz', userProfile, onPracticeCountChange }: HooponoponoModalProps)", 'hoop destructure')
          text = replace_once(text,
          '''  const markDone = () => {
    setPrayedToday(true);
    try { localStorage.setItem(`cura_integrada_hooponopono_${getLocalDateString()}`, 'true'); }
    catch (error) { console.warn('Não foi possível registrar a prática localmente.', error); }
  };

  const increment = () => {
    audioEngine.unlock();
    setCount(previous => {
      const next = Math.min(targetCount, previous + 1);
      if (next >= targetCount) markDone();
      return next;
    });
  };''',
          '''  const markDone = () => {
    if (prayedToday) return;
    setPrayedToday(true);
    onPracticeCountChange?.(Number(userProfile?.hooponoponoPracticedCount || 0) + 1);
    try { localStorage.setItem(`cura_integrada_hooponopono_${getLocalDateString()}`, 'true'); }
    catch (error) { console.warn('Não foi possível registrar a prática localmente.', error); }
  };

  const increment = () => {
    audioEngine.unlock();
    const next = Math.min(targetCount, count + 1);
    setCount(next);
    if (next >= targetCount) markDone();
  };''', 'hoop progress')
          path.write_text(text)

          path = Path('src/lib/achievementsData.ts')
          text = path.read_text()
          text = replace_once(text,
            "  const hasAstralMap = Boolean(profile?.astralMap || profile?.birthDate);\n  const hasArchangel = Boolean(profile?.archangelPrayerCompletedDays && profile.archangelPrayerCompletedDays.length > 0);\n  const hasHooponopono = Boolean((profile?.hooponoponoPracticedCount || 0) > 0);",
            "  const hasAstralMap = Boolean(profile?.astralMap);\n  const hasSevenChakraJourney = Boolean(profile?.journeyProgress?.arcanjo7CompletedDays && profile.journeyProgress.arcanjo7CompletedDays.length >= 7);\n  const hasArchangel = Boolean(profile?.archangelPrayerCompletedDays && profile.archangelPrayerCompletedDays.length > 0);\n  const hasHooponopono = Boolean((profile?.hooponoponoPracticedCount || 0) > 0);",
            'achievement evidence')
          text = replace_once(text, "  if (completedCount >= 7) unlockedIds.add('mestre_dos_chakras');", "  if (hasSevenChakraJourney) unlockedIds.add('mestre_dos_chakras');", 'chakra achievement')
          path.write_text(text)

          path = Path('src/components/AchievementsModal.tsx')
          text = path.read_text()
          text = replace_once(text, 'style={{ width: `${Math.max(evaluation.percentage, 5)}%` }}', 'style={{ width: `${evaluation.percentage}%` }}', 'achievement progress width')
          text = text.replace('text-amber-400', 'text-[#B88736]')
          text = text.replace('bg-amber-500/20', 'bg-[#B88736]/12')
          text = text.replace('border-amber-500/40', 'border-[#B88736]/30')
          text = text.replace('from-amber-500 to-amber-300', 'from-[#8F631E] to-[#D6A756]')
          text = text.replace('from-amber-500/20 to-amber-600/10 border-amber-500/50', 'from-[#B88736]/15 to-[#D6A756]/8 border-[#B88736]/30')
          path.write_text(text)

          path = Path('src/App.tsx')
          text = path.read_text()
          text = replace_once(text,
            '''        <ArchangelMichaelPrayerModal
          isOpen={showArchangelModal}
          onClose={() => setShowArchangelModal(false)}
          userName={userProfile?.name}
        />''',
            '''        <ArchangelMichaelPrayerModal
          isOpen={showArchangelModal}
          onClose={() => setShowArchangelModal(false)}
          userName={userProfile?.name}
          onProgressChange={(days) => {
            if (userProfile) saveProfile({ ...userProfile, archangelPrayerCompletedDays: days });
          }}
        />''',
            'App archangel callback')
          text = replace_once(text,
            '''        <HooponoponoModal
          isOpen={showHooponoponoModal}
          onClose={() => setShowHooponoponoModal(false)}
          userName={userProfile?.name}
          userProfile={userProfile || undefined}
        />''',
            '''        <HooponoponoModal
          isOpen={showHooponoponoModal}
          onClose={() => setShowHooponoponoModal(false)}
          userName={userProfile?.name}
          userProfile={userProfile || undefined}
          onPracticeCountChange={(count) => {
            if (userProfile) saveProfile({ ...userProfile, hooponoponoPracticedCount: count });
          }}
        />''',
            'App hoop callback')
          path.write_text(text)

      - name: Verify expected files changed
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test "$(git status --short | wc -l)" -eq 5
          git status --short | grep -q 'src/App.tsx'
          git status --short | grep -q 'src/components/AchievementsModal.tsx'
          git status --short | grep -q 'src/components/ArchangelMichaelPrayerModal.tsx'
          git status --short | grep -q 'src/components/HooponoponoModal.tsx'
          git status --short | grep -q 'src/lib/achievementsData.ts'

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified achievement fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/AchievementsModal.tsx src/components/ArchangelMichaelPrayerModal.tsx src/components/HooponoponoModal.tsx src/lib/achievementsData.ts
          git commit -m 'fix: base achievements on persisted evidence'
          git push origin HEAD:main
