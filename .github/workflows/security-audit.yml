name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='package-lock.json' \
            '(AIza[0-9A-Za-z_-]{20,}|sk_live_[0-9A-Za-z]+|rk_live_[0-9A-Za-z]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo 'Potential hard-coded secret detected.'
            exit 1
          fi

      - name: Verify payment endpoints are fail-closed
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mock-checkout' server.ts && {
            echo 'Mock checkout is still present in server.ts.'
            exit 1
          } || true
          grep -q 'app.post("/api/user/upgrade"' server.ts && {
            echo 'Unsafe manual upgrade endpoint is still present.'
            exit 1
          } || true
