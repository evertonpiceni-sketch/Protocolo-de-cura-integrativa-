name: Security Audit

on:
  push:
    branches: [main, security-hardening-2026-08-30]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Check for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude='*.lock' \
            '(AIza[0-9A-Za-z_-]{20,}|sk_live_[0-9A-Za-z]+|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|password[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+["'"'])' .; then
            echo "Potential hard-coded secret detected. Review the matches before merging."
            exit 1
          fi
