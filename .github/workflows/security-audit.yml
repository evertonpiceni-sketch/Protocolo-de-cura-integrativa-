name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='package-lock.json' \
            '(AIza[0-9A-Za-z_-]{20,}|sk_live_[0-9A-Za-z]+|rk_live_[0-9A-Za-z]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo 'Potential hard-coded secret detected.'
            exit 1
          fi

      - name: Verify JWT configuration is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const JWT_SECRET = process.env.JWT_SECRET' server.ts
          grep -q 'JWT_SECRET.length < 32' server.ts
          if grep -q 'super-secret-cura' server.ts; then
            echo 'Insecure JWT fallback detected.'
            exit 1
          fi

      - name: Verify public registration cannot create admin
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'role: "user"' server.ts
          if grep -q 'db.users.length === 0 ? "admin"' server.ts; then
            echo 'First-user admin escalation is still present.'
            exit 1
          fi

      - name: Verify payment endpoints are fail-closed
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'mock-checkout' server.ts; then
            echo 'Mock checkout is still present in server.ts.'
            exit 1
          fi
          if grep -q 'app.post("/api/user/upgrade"' server.ts; then
            echo 'Unsafe manual upgrade endpoint is still present.'
            exit 1
          fi
          grep -q 'Pagamento ainda não está configurado' server.ts
          grep -q 'Webhook de pagamento ainda não está configurado' server.ts
