name: Apply Serverless Refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refactor Express entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')

          changed = False
          if 'import { createServer as createViteServer } from "vite";\n' in s:
              s = s.replace('import { createServer as createViteServer } from "vite";\n', '')
              changed = True
          if 'async function startServer() {' in s:
              s = s.replace('async function startServer() {', 'export function createApp() {', 1)
              changed = True
          if '  const PORT = 3000;\n' in s:
              s = s.replace('  const PORT = 3000;\n', '', 1)
              changed = True

          marker = '  // Vite middleware for dev / static for production'
          if marker in s:
              start = s.index(marker)
              end = s.index('  // Global Error Handler', start)
              static_block = '''  // Serve the production frontend when this process is serving HTTP directly.\n  const distPath = path.join(process.cwd(), "dist");\n  app.use(express.static(distPath));\n  app.get("*", (_req, res) => {\n    res.sendFile(path.join(distPath, "index.html"));\n  });\n\n\n'''
              s = s[:start] + static_block + s[end:]
              changed = True

          old_tail = '''  app.listen(PORT, "0.0.0.0", () => {\n    console.log(`✨ Servidor do Protocolo de Cura Integrada rodando em http://localhost:${PORT}`);\n  });\n}\n\nstartServer();'''
          new_tail = '''  return app;\n}\n\nconst app = createApp();\n\nif (process.env.VERCEL !== "1") {\n  const PORT = Number(process.env.PORT || 3000);\n  app.listen(PORT, "0.0.0.0", () => {\n    console.log(`✨ Servidor do Protocolo de Cura Integrada rodando em http://localhost:${PORT}`);\n  });\n}\n\nexport default app;'''
          if old_tail in s:
              s = s.replace(old_tail, new_tail, 1)
              changed = True

          if changed:
              p.write_text(s, encoding='utf-8')

          Path('api/index.ts').write_text('import app from "../server";\n\nexport default app;\n', encoding='utf-8')
          Path('vercel.json').write_text('{\n  "buildCommand": "npm run build",\n  "outputDirectory": "dist"\n}\n', encoding='utf-8')
          PY

      - name: Install and validate
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build

      - name: Verify exported Express app
        env:
          VERCEL: "1"
          JWT_SECRET: "test-only-secret-with-at-least-32-characters"
        run: |
          node - <<'NODE'
          const mod = require('./dist/server.cjs');
          const app = mod.default || mod;
          if (!app || typeof app.handle !== 'function') throw new Error('Express app export missing');
          console.log('Express export OK');
          NODE

      - name: Commit backend refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts api/index.ts vercel.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: expose Express backend as Vercel Function"
          git push
