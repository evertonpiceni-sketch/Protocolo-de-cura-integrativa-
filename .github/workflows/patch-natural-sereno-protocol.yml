name: Patch Natural Sereno Protocol Timing

on:
  push:
    paths:
      - '.github/workflows/patch-natural-sereno-protocol.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch protocol timing and exact Solfeggio
        run: |
          python <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          once(
              'src/components/MeditationSession.tsx',
              "import { resolveProtocolScript } from '../lib/protocolScript';\n",
              "import { resolveProtocolScript } from '../lib/protocolScript';\nimport { normalizeProtocolProgress } from '../utils/protocolPlayback';\n"
          )
          once(
              'src/components/MeditationSession.tsx',
              """      onProgress: (curr, dur) => {
        // HTMLAudio reports seconds. Web Speech's SpeechSynthesisEvent.elapsedTime
        // is milliseconds; the fallback deliberately reports duration=0.
        const normalizedCurrent = dur > 0 ? curr : curr / 1000;
        setCurrentTime(Number.isFinite(normalizedCurrent) ? normalizedCurrent : 0);
        setDuration(Number.isFinite(dur) && dur > 0 ? dur : 0);
      },""",
              """      onProgress: (curr, dur) => {
        const progress = normalizeProtocolProgress(curr, dur);
        setCurrentTime(progress.current);
        setDuration(progress.duration);
      },"""
          )

          once(
              'src/components/ArcanjoProtocolView.tsx',
              "import { audioEngine } from '../lib/audio';\n",
              "import { audioEngine } from '../lib/audio';\nimport { solfeggioTone } from '../lib/solfeggioTone';\n"
          )
          p = Path('src/components/ArcanjoProtocolView.tsx')
          text = p.read_text()
          if 'audioEngine.startSynth(`${config.freq}hz`);' not in text:
              raise SystemExit('Arcanjo startSynth target missing')
          text = text.replace('audioEngine.startSynth(`${config.freq}hz`);', 'solfeggioTone.start(config.freq);')
          if 'audioEngine.stopSynth();' not in text:
              raise SystemExit('Arcanjo stopSynth target missing')
          text = text.replace('audioEngine.stopSynth();', 'solfeggioTone.stop();')
          p.write_text(text)
          PY

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-natural-sereno-protocol.yml
          git add src/components/MeditationSession.tsx src/components/ArcanjoProtocolView.tsx src/lib/solfeggioTone.ts src/utils/protocolPlayback.ts tests/protocol-playback.test.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: align protocol timing and exact Solfeggio playback'
          git push origin HEAD:main
