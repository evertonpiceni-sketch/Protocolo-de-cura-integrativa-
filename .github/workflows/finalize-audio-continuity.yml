name: Finalize persistent meditation audio

on:
  push:
    paths:
      - '.github/workflows/finalize-audio-continuity.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch audio continuity
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/audio.ts')
          s = p.read_text()
          replacements = [
          ("""    this.stopBG();
    this.synthType = type;

    if (type === 'none') {
      return;
    }

    this.startSynthesizedBG(type);""", """    // Switching tracks must not pause the HTMLMediaElement used by Media Session.
    this.stopSynthesizedBG();
    this.synthType = type;

    if (type === 'none') {
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      return;
    }

    this.initKeepAlive();
    this.bgAudio?.play().catch(() => {});
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    this.startSynthesizedBG(type);"""),
          ("""  public stopBG() {
    this.stopSynthesizedBG();
    this.synthType = 'none';
    if (this.bgAudio) {
      this.bgAudio.pause();
    }
  }""", """  public stopBG() {
    this.stopSynthesizedBG();
    this.synthType = 'none';
    if (this.bgAudio) this.bgAudio.pause();
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  }"""),
          ("""          navigator.mediaSession.setActionHandler('play', () => {
            this.resumeSpeech();
            this.bgAudio?.play().catch(()=>{});
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
          });
          navigator.mediaSession.setActionHandler('pause', () => {
            this.pauseSpeech();
            this.bgAudio?.pause();
          });""", """          navigator.mediaSession.setActionHandler('play', () => {
            this.resumeSpeech();
            this.bgAudio?.play().catch(()=>{});
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
            navigator.mediaSession.playbackState = 'playing';
          });
          navigator.mediaSession.setActionHandler('pause', () => {
            this.pauseSpeech();
            if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {});
            navigator.mediaSession.playbackState = 'paused';
          });"""),
          ("""          audio.onplay = () => {
            this.isElevenLabsPlaying = true;
            this.isSpeakingActive = true;
            onStart();
          };""", """          audio.onplay = () => {
            this.isElevenLabsPlaying = true;
            this.isSpeakingActive = true;
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            onStart();
          };""")]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('audio patch target not found')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/components/MeditationSession.tsx')
          s = p.read_text()
          old = """  // Stop all audio on unmount to prevent leaks
  useEffect(() => {
    return () => {
      audioEngine.stopBG();
      audioEngine.stopSpeech();
      if (reflectionTimerRef.current) clearInterval(reflectionTimerRef.current);
    };
  }, []);"""
          new = """  // Keep ambient audio alive while navigating inside the SPA.
  // Narration remains scoped to the meditation screen.
  useEffect(() => {
    return () => {
      audioEngine.stopSpeech();
      if (reflectionTimerRef.current) clearInterval(reflectionTimerRef.current);
    };
  }, []);"""
          if old not in s:
              raise SystemExit('MeditationSession patch target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/audio.ts src/components/MeditationSession.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(audio): keep meditation ambience across navigation and lock controls'
          git push origin main
