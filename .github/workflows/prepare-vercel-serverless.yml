name: Prepare Vercel Serverless Backend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: startsWith(github.event.head_commit.message, 'prepare: serverless refactor')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refactor Express entrypoint for Vercel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')

          s = s.replace('import { createServer as createViteServer } from "vite";\n', '')
          s = s.replace('async function startServer() {', 'export function createApp() {', 1)
          s = s.replace('  const PORT = 3000;\n', '', 1)

          start = s.index('  // Vite middleware for dev / static for production')
          end = s.index('  // Global Error Handler', start)
          static_block = '''  // Serve the production frontend when this process is serving HTTP directly.\n  // Vercel also exposes this same Express app through api/index.ts.\n  const distPath = path.join(process.cwd(), "dist");\n  app.use(express.static(distPath));\n  app.get("*", (_req, res) => {\n    res.sendFile(path.join(distPath, "index.html"));\n  });\n\n\n'''
          s = s[:start] + static_block + s[end:]

          old_tail = '''  app.listen(PORT, "0.0.0.0", () => {\n    console.log(`✨ Servidor do Protocolo de Cura Integrada rodando em http://localhost:${PORT}`);\n  });\n}\n\nstartServer();'''
          new_tail = '''  return app;\n}\n\nconst app = createApp();\n\n// Traditional local/server deployment keeps the existing port-based start command.\n// Vercel imports the Express app through api/index.ts and does not open a listener.\nif (process.env.VERCEL !== "1") {\n  const PORT = Number(process.env.PORT || 3000);\n  app.listen(PORT, "0.0.0.0", () => {\n    console.log(`✨ Servidor do Protocolo de Cura Integrada rodando em http://localhost:${PORT}`);\n  });\n}\n\nexport default app;'''
          if old_tail not in s:
              raise SystemExit('Expected server tail was not found; aborting without changes.')
          s = s.replace(old_tail, new_tail, 1)
          p.write_text(s, encoding='utf-8')

          Path('api/index.ts').write_text('''import app from "../server";\n\nexport default app;\n''', encoding='utf-8')
          Path('vercel.json').write_text('''{\n  "buildCommand": "npm run build",\n  "outputDirectory": "dist"\n}\n''', encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify serverless entrypoint
        shell: bash
        env:
          VERCEL: "1"
          JWT_SECRET: "test-only-secret-with-at-least-32-characters"
        run: |
          set -euo pipefail
          node - <<'NODE'
          const mod = require('./dist/server.cjs');
          const app = mod.default || mod;
          if (!app || typeof app.handle !== 'function') {
            throw new Error('Express app was not exported from the server bundle.');
          }
          console.log('Express app export: OK');
          NODE

      - name: Commit refactor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts api/index.ts vercel.json
          git diff --cached --quiet && { echo 'No changes to commit.'; exit 0; }
          git commit -m "fix: refactor Express backend for Vercel Functions"
          git push
