name: Apply Security Hardening

on:
  push:
    branches: [main]
    paths:
      - 'server.ts'
      - 'scripts/harden-security.mjs'
      - '.github/workflows/apply-security-hardening.yml'
      - 'patch_server.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[security-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply security hardening
        run: node scripts/harden-security.mjs

      - name: Commit hardened server
        run: |
          if git diff --quiet -- server.ts; then
            echo "No server changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "security: harden authentication and payment endpoints [security-hardening]"
          git push
