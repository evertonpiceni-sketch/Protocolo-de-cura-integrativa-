name: Apply security hardening

on:
  push:
    paths:
      - 'patch_server.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply security patch
        run: python patch_server.py

      - name: Commit hardened server
        run: |
          if git diff --quiet -- server.ts; then
            echo "No server changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "security: harden authentication and payment endpoints"
          git push
