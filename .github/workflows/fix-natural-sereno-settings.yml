name: Fix Natural Sereno Settings

on:
  push:
    paths:
      - '.github/workflows/fix-natural-sereno-settings.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch audited Settings findings
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()

          replacements = [
            ('Customização do Protocolo', 'Intenções da Prática'),
            ('Foco de Cura (Intenção Direcionada)', 'Intenções que desejo cultivar'),
            ('Selecione as intenções que deseja reforçar durante as sessões do protocolo.', 'Selecione as intenções que deseja cultivar e recordar durante as práticas.'),
            ("'bg-emerald-600/20 border-emerald-500 text-emerald-300'", "'bg-[#B88736]/12 border-[#B88736] text-[#8F631E]'"),
            ("'bg-indigo-600/30 border-indigo-500 text-indigo-300'", "'bg-[#B88736]/12 border-[#B88736] text-[#8F631E]'"),
            ('Ative ou pause a reprodução contínua da trilha de cura.', 'Ative ou pause a reprodução contínua da trilha de apoio.'),
            ('<h3 className="text-sm font-display font-medium text-emerald-400 flex items-center gap-1.5">', '<h3 className="text-sm font-display font-medium text-[#2A2420] flex items-center gap-1.5">'),
            ('<MessageCircle size={15} className="text-emerald-400" />', '<MessageCircle size={15} className="text-[#B88736]" />'),
            ('Tire dúvidas sobre o protocolo ou peça amparo energético com o terapeuta.', 'Tire dúvidas sobre a jornada, o uso dos recursos ou fale com o terapeuta.'),
            ('className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition cursor-pointer shadow-md shadow-emerald-600/20 shrink-0"', 'className="min-h-11 px-3.5 py-2 bg-[#B88736] hover:bg-[#8F631E] text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition cursor-pointer shadow-sm shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#B88736]/35"'),
            ('Tratamento Específico Individual (7 Dias / 21 Dias por R$ 59,90)', 'Prática Individual (7 ou 21 dias)'),
            ('Canalização energética personalizada de 7 ou 21 dias para sua queixa ou dor física específica.', 'Prática energética individual de 7 ou 21 dias orientada pela intenção e pelo contexto que você compartilhar. Valores e opções são apresentados no formulário.'),
            ('className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold cursor-pointer transition shrink-0"', 'className="min-h-11 px-3 py-2 bg-[#B88736] hover:bg-[#8F631E] text-white rounded-xl text-xs font-semibold cursor-pointer transition shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#B88736]/35"'),
            ('Solicitar Novo', 'Solicitar prática'),
            ('Seus Tratamentos Específicos (', 'Suas práticas individuais ('),
            ('className="p-4 bg-white border border-[#E5DAC6] hover:border-emerald-500/30 rounded-2xl flex flex-col justify-between space-y-2 text-xs transition shadow-sm"', 'className="p-4 bg-white border border-[#E5DAC6] hover:border-[#B88736]/40 rounded-2xl flex flex-col justify-between space-y-2 text-xs transition shadow-sm"'),
            ('className="font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20 text-[10px] uppercase"', 'className="font-bold text-[#8F631E] bg-[#B88736]/10 px-2 py-0.5 rounded-full border border-[#B88736]/20 text-[10px] uppercase"'),
            ("{t.title || 'Tratamento Pontual'}", "{t.title || 'Prática Individual'}"),
            ('className="pt-2 border-t border-[#E5DAC6]/80 flex justify-between items-center text-[10px] text-indigo-300 font-mono mt-2"', 'className="pt-2 border-t border-[#E5DAC6]/80 flex justify-between items-center text-[10px] text-[#8F631E] font-mono mt-2"'),
            ('<span>Decreto: Ativo</span>', '<span>Status: Ativo</span>'),
            ('<Award size={14} className="text-amber-400" />', '<Award size={14} className="text-[#B88736]" />'),
            ('<Heart size={14} className="text-emerald-400" />', '<Heart size={14} className="text-[#B88736]" />'),
            ('<Sparkles size={12} className="text-amber-400" />', '<Sparkles size={12} className="text-[#B88736]" />'),
            ('<Crown size={14} className="text-amber-400" />', '<Crown size={14} className="text-[#B88736]" />')
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected one match, found {count}: {old[:88]!r}')
            text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Verify only App changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          echo "$changed"
          test "$(git status --short | wc -l)" -eq 1
          echo "$changed" | grep -Eq '^ M src/App\.tsx$'

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified Settings fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'fix: align settings and individual practice with Natural Sereno'
          git push origin HEAD:main
