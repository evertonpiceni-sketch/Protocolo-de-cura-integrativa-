name: Fix App Core Audit Findings

on:
  push:
    paths:
      - '.github/workflows/fix-app-core-audit.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch verified App core findings
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          replacements = [
            (
              "  ) => {\n    // 1. Update the daily progress logs\n    const updatedProgress = progress.map(day => {",
              "  ) => {\n    const wasAlreadyCompleted = progress.some(day => day.dayNumber === dayNum && day.completed);\n\n    // 1. Update the daily progress logs without rewriting the original completion date.\n    const updatedProgress = progress.map(day => {"
            ),
            (
              "        completedAt: new Date().toISOString(),",
              "        completedAt: day.completedAt || new Date().toISOString(),"
            ),
            (
              "      let streak = userProfile.currentStreak;\n      streak = streak + 1;\n      const newLongest = Math.max(streak, userProfile.longestStreak);",
              "      const previousStreak = Number(userProfile.currentStreak || 0);\n      const streak = wasAlreadyCompleted ? previousStreak : previousStreak + 1;\n      const newLongest = Math.max(streak, Number(userProfile.longestStreak || 0));"
            ),
            (
              "Atenção: Isso irá apagar todo o seu progresso dos 21 dias e as anotações do diário de cura. Deseja reiniciar o ciclo de cura?",
              "Atenção: esta ação apagará o progresso dos 21 dias e as anotações vinculadas a essa jornada. Deseja reiniciar a jornada de 21 dias?"
            ),
            (
              "        completed: false,\n        journalText: '',\n        mood: 5",
              "        completed: false,\n        journalText: ''"
            ),
            (
              "    if (!mood) return \"Pacífico\";",
              "    if (typeof mood !== 'number') return \"Não registrado\";"
            ),
            (
              "      default: return \"Pacífico\";",
              "      default: return \"Não registrado\";"
            )
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected one match, found {count}: {old[:72]!r}')
            text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Verify only App changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          echo "$changed"
          test "$(git status --short | wc -l)" -eq 1
          echo "$changed" | grep -Eq '^ M src/App\.tsx$'

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified App fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'fix: keep journey reset and streak data truthful'
          git push origin HEAD:main
