<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Confirmação do pagamento</title>
  <style>
    :root { font-family: Georgia, 'Times New Roman', serif; color: #26372a; background: #fbf8f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(180deg,#fffdf8 0%,#f8f4ec 100%); }
    main { width: min(100%, 560px); border: 1px solid rgba(184,135,54,.22); border-radius: 28px; padding: clamp(24px,6vw,42px); background: rgba(255,255,255,.86); box-shadow: 0 24px 70px rgba(31,46,39,.09); text-align: center; }
    .signature { display: inline-block; margin-bottom: 20px; font-family: Arial, sans-serif; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: #8f631e; opacity: .62; }
    h1 { margin: 0 0 12px; font-size: clamp(28px,7vw,42px); font-weight: 500; }
    p { margin: 0 auto; max-width: 440px; font-family: Arial, sans-serif; font-size: 15px; line-height: 1.65; color: #5c5248; }
    .status { margin: 24px 0 0; padding: 15px 18px; border-radius: 16px; border: 1px solid #e5dac6; background: #fbf8f2; font-family: Arial, sans-serif; font-size: 13px; }
    .success { border-color: rgba(47,107,80,.28); background: rgba(47,107,80,.07); color: #275c45; }
    .pending { color: #765a25; }
    .error { border-color: rgba(190,24,93,.18); background: rgba(190,24,93,.05); color: #9f1239; }
    a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; margin-top: 22px; padding: 0 22px; border-radius: 14px; background: #073b2b; color: #fff9e8; text-decoration: none; font-family: Arial, sans-serif; font-weight: 700; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span class="signature">Protocolo da Transformação</span>
    <h1 id="title">Confirmando seu pagamento</h1>
    <p id="message">A liberação acontece somente depois que o servidor confirma a transação diretamente com a InfinitePay.</p>
    <div id="status" class="status pending" role="status" aria-live="polite">Verificando a confirmação segura…</div>
    <a id="continue" href="/" hidden>Entrar na jornada</a>
  </main>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const payload = {
        order_nsu: params.get('order_nsu') || '',
        transaction_nsu: params.get('transaction_nsu') || '',
        slug: params.get('slug') || '',
      };
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const status = document.getElementById('status');
      const button = document.getElementById('continue');
      try {
        if (!payload.order_nsu || !payload.transaction_nsu || !payload.slug) throw new Error('O retorno não trouxe todos os identificadores necessários.');
        const response = await fetch('/api/payment/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(payload),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.status !== 'paid') throw new Error(data.error || 'O pagamento ainda não foi confirmado.');
        title.textContent = 'Pagamento confirmado';
        message.textContent = 'Seu acesso foi liberado com segurança. Você já pode seguir para a jornada.';
        status.textContent = 'Confirmação recebida e acesso liberado.';
        status.className = 'status success';
        button.hidden = false;
      } catch (error) {
        title.textContent = 'Confirmação pendente';
        message.textContent = 'Seu conteúdo não foi liberado sem confirmação. Se o pagamento acabou de ser feito, você pode voltar à jornada e tentar novamente depois.';
        status.textContent = error instanceof Error ? error.message : 'Pagamento ainda não confirmado.';
        status.className = 'status error';
        button.textContent = 'Voltar à jornada';
        button.hidden = false;
      }
    })();
  </script>
</body>
</html>
