<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  
  <!-- Outer Sacred Halo -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="url(#violetGrad)" stroke-width="2.5" opacity="0.6" stroke-dasharray="6 4" />
  <circle cx="96" cy="96" r="58" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Central Lotus / Sacred Geometry Energy Flame -->
  <g filter="url(#glow)" transform="translate(96, 96)">
    <!-- Base petal -->
    <path d="M 0,-42 C 24,-18 36,12 0,38 C -36,12 -24,-18 0,-42 Z" fill="url(#violetGrad)" opacity="0.9" />
    
    <!-- Left petal -->
    <path d="M 0,26 C -20,10 -38,-10 -32,-30 C -22,-14 -12,8 0,26 Z" fill="url(#goldGrad)" opacity="0.85" />
    
    <!-- Right petal -->
    <path d="M 0,26 C 20,10 38,-10 32,-30 C 22,-14 12,8 0,26 Z" fill="url(#goldGrad)" opacity="0.85" />
    
    <!-- Core diamond crystal -->
    <polygon points="0,-18 10,0 0,18 -10,0" fill="#ffffff" opacity="0.95" />
    <circle cx="0" cy="0" r="3" fill="#fbbf24" />
  </g>
</svg>
