<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="violetGrad512" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />
  
  <!-- Outer Sacred Geometry Halo -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#violetGrad512)" stroke-width="6" opacity="0.6" stroke-dasharray="14 10" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#goldGrad512)" stroke-width="3" opacity="0.4" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.2" />

  <!-- Central Lotus & Healing Flame Core -->
  <g filter="url(#glow512)" transform="translate(256, 256)">
    <!-- Central Ascension Leaf -->
    <path d="M 0,-115 C 65,-50 98,30 0,105 C -98,30 -65,-50 0,-115 Z" fill="url(#violetGrad512)" opacity="0.9" />
    
    <!-- Left Petal -->
    <path d="M 0,70 C -55,25 -105,-28 -88,-82 C -60,-40 -32,20 0,70 Z" fill="url(#goldGrad512)" opacity="0.85" />
    
    <!-- Right Petal -->
    <path d="M 0,70 C 55,25 105,-28 88,-82 C 60,-40 32,20 0,70 Z" fill="url(#goldGrad512)" opacity="0.85" />
    
    <!-- Core diamond crystal -->
    <polygon points="0,-48 26,0 0,48 -26,0" fill="#ffffff" opacity="0.95" />
    <circle cx="0" cy="0" r="8" fill="#fbbf24" />
  </g>
</svg>
