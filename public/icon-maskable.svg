<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="violetGradMask" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for Android Adaptive/Maskable Icons -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />
  
  <!-- Safe-zone centered design (inside 80% circle) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#violetGradMask)" stroke-width="4" opacity="0.6" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="115" fill="none" stroke="url(#goldGradMask)" stroke-width="2" opacity="0.4" />

  <g transform="translate(256, 256)">
    <!-- Central Ascension Leaf -->
    <path d="M 0,-85 C 48,-38 72,22 0,78 C -72,22 -48,-38 0,-85 Z" fill="url(#violetGradMask)" opacity="0.9" />
    
    <!-- Left Petal -->
    <path d="M 0,52 C -40,18 -78,-20 -65,-60 C -45,-30 -24,15 0,52 Z" fill="url(#goldGradMask)" opacity="0.85" />
    
    <!-- Right Petal -->
    <path d="M 0,52 C 40,18 78,-20 65,-60 C 45,-30 24,15 0,52 Z" fill="url(#goldGradMask)" opacity="0.85" />
    
    <!-- Core diamond crystal -->
    <polygon points="0,-36 20,0 0,36 -20,0" fill="#ffffff" opacity="0.95" />
    <circle cx="0" cy="0" r="6" fill="#fbbf24" />
  </g>
</svg>
